<template>
    <div class="pfn-group" role="radiogroup" aria-label="Pass, Fail, or Not Applicable">
        <template for:each={buttons} for:item="b">
            <button
                key={b.value}
                type="button"
                class={b.cssClass}
                role="radio"
                aria-checked={b.ariaChecked}
                data-value={b.value}
                onclick={handleSelect}
            >
                <lightning-icon class="pfn-icon" icon-name={b.icon} size="small" alternative-text=""></lightning-icon>
                <span class="pfn-label">{b.label}</span>
            </button>
        </template>
    </div>
</template>
